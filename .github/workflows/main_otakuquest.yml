# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - otakuquest

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Deploy to Azure Production after checking the .NET 10 runtime'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: OtakuQuest/otakuquest.client/package-lock.json

      - name: Install frontend dependencies
        working-directory: OtakuQuest/otakuquest.client
        run: npm ci

      - name: Build with dotnet
        run: dotnet build ./OtakuQuest/OtakuQuest.Server --configuration Release

      - name: dotnet publish
        env:
          # Empty means same-origin /api requests for the frontend hosted by this app.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        run: dotnet publish ./OtakuQuest/OtakuQuest.Server -c Release --no-restore --self-contained false -p:UseAppHost=false -o ./artifacts/publish

      - name: Check published app without connecting to Azure SQL
        run: node tests/check-published-app.mjs ./artifacts/publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ./artifacts/publish
          if-no-files-found: error

  deploy:
    # PRs and pushes only validate. Production requires an explicit manual run on main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_production == true
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: otakuquest-production
      cancel-in-progress: false
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E66A1956F3864874855DEF31025D47DC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_FA2D5ACF093742C1BEF59598E0EE2653 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C5B06FE141C24112BC6E9080EB8A1EA2 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'otakuquest'
          slot-name: 'Production'
          package: .
          
